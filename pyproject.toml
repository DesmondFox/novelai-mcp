[project]
name = "novelai-mcp"
dynamic = ["version"]
description = "Model Context Protocol (MCP) server for NovelAI image generation: V5/V4.5, img2img, inpaint, Director Tools, upscale, Vibe Transfer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DesmondFox" }]
keywords = ["mcp", "model-context-protocol", "novelai", "image-generation", "claude", "anime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/DesmondFox/novelai-mcp"
Issues = "https://github.com/DesmondFox/novelai-mcp/issues"

[project.scripts]
novelai-mcp = "novelai_mcp.server:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "novelai_mcp.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
